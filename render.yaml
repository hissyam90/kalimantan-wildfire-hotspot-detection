services:
  - type: web
    name: wildfire-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FIRMS_KEY
        sync: false
      - key: OWM_KEY
        sync: false
      - key: WAQI_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false